<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Sistema de Licitações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="tela-login">
  <div class="cartao-login">
    <div class="text-center mb-4">
      <div class="mx-auto mb-2" style="width:48px;height:48px;border:2px solid var(--azul-institucional);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fonte-mono);font-weight:600;color:var(--azul-institucional);">SL</div>
      <h5 class="mb-0">Sistema de Licitações</h5>
      <div class="text-muted" style="font-size:0.8rem;">Solicitação e Aprovação de Participação</div>
    </div>

    <form id="form-login">
      <div class="mb-3">
        <label class="form-label">E-mail corporativo</label>
        <input type="email" class="form-control" id="email" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha" required autocomplete="current-password">
      </div>
      <div id="erro-login" class="text-danger small mb-3" style="display:none;"></div>
      <button type="submit" class="btn btn-primario w-100 py-2">Entrar</button>
    </form>

    <div class="text-center text-muted mt-4" style="font-size:0.75rem;">
      Acesso restrito a colaboradores autorizados.<br>Problemas para entrar? Contate o suporte de TI.
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const erroEl = document.getElementById('erro-login');
    erroEl.style.display = 'none';

    try {
      const resposta = await API.post('/auth/login', {
        email: document.getElementById('email').value,
        senha: document.getElementById('senha').value
      });
      localStorage.setItem('licitacoes_token', resposta.token);
      localStorage.setItem('licitacoes_usuario', JSON.stringify(resposta.usuario));
      window.location.href = 'dashboard.html';
    } catch (err) {
      erroEl.textContent = err.message || 'Não foi possível entrar. Verifique suas credenciais.';
      erroEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
