<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta e Pesquisa — Sistema de Licitações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="d-flex align-items-center">
      <span class="selo">SL</span>
      <div class="titulo">Sistema de<br>Licitações</div>
    </div>
  </div>
  <nav>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="nova-solicitacao.html">📝 Nova Solicitação</a>
    <a href="consulta.html" class="ativo">🔎 Consulta e Pesquisa</a>
    <a href="aprovacao.html">✅ Fila de Aprovação</a>
  </nav>
  <div class="usuario-rodape">
    <div id="usuario-nome" style="color:#fff;font-weight:600;"></div>
    <div id="usuario-perfil" class="text-muted"></div>
    <a href="#" onclick="encerrarSessao()" class="d-block mt-2" style="color:#8FA5BE;">Sair</a>
  </div>
</aside>

<main class="conteudo">
  <div class="topo-pagina">
    <div>
      <h4 class="mb-0">Consulta e Pesquisa</h4>
      <div class="text-muted" style="font-size:0.85rem;">Localize solicitações por status, edital, órgão e outros filtros</div>
    </div>
  </div>

  <div class="painel mb-3">
    <form id="form-filtros" class="row g-2">
      <div class="col-md-2">
        <label class="form-label">Status</label>
        <select class="form-select form-select-sm" name="status">
          <option value="">Todos</option>
          <option value="RASCUNHO">Rascunho</option>
          <option value="PENDENTE_APROVACAO">Pendente de Aprovação</option>
          <option value="EM_ANALISE">Em Análise</option>
          <option value="APROVADO">Aprovado</option>
          <option value="REPROVADO">Reprovado</option>
          <option value="CANCELADO">Cancelado</option>
        </select>
      </div>
      <div class="col-md-2"><label class="form-label">Edital</label><input class="form-control form-control-sm" name="edital"></div>
      <div class="col-md-2"><label class="form-label">Órgão</label><input class="form-control form-control-sm" name="orgao"></div>
      <div class="col-md-2"><label class="form-label">Concessionária</label><input class="form-control form-control-sm" name="concessionaria"></div>
      <div class="col-md-1"><label class="form-label">UF</label><input class="form-control form-control-sm" name="uf" maxlength="2"></div>
      <div class="col-md-2"><label class="form-label">Solicitante</label><input class="form-control form-control-sm" name="solicitante"></div>
      <div class="col-md-1 d-flex align-items-end"><button class="btn btn-primario btn-sm w-100">Filtrar</button></div>
    </form>
  </div>

  <div class="painel">
    <div class="table-responsive">
      <table class="table tabela-licitacoes">
        <thead>
          <tr><th>Protocolo</th><th>Órgão</th><th>Edital</th><th>UF</th><th>Solicitante</th><th>Valor Estimado</th><th>Status</th><th>Data</th></tr>
        </thead>
        <tbody id="tabela-resultados"><tr><td colspan="8" class="text-center text-muted py-4">Carregando…</td></tr></tbody>
      </table>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-2">
      <div class="text-muted small" id="info-paginacao"></div>
      <div class="btn-group">
        <button class="btn btn-outline-secondary btn-sm" id="btn-pag-anterior">← Anterior</button>
        <button class="btn btn-outline-secondary btn-sm" id="btn-pag-proxima">Próxima →</button>
      </div>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/consulta.js"></script>
</body>
</html>
